<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting — PrepModule</title>
<meta name="robots" content="noindex">
<!-- The SAT and AP pages became one tutoring page. Forward with ?program=sat, keeping campaign parameters. -->
<script>(function () { var q = new URLSearchParams(location.search); q.delete('area'); q.delete('apSubject'); q.set('program', 'sat'); var h = /^#expert-/.test(location.hash) ? '#experts' : location.hash; location.replace('../?' + q.toString() + h); })();</script>
<meta http-equiv="refresh" content="0; url=../?program=sat">
</head>
<body style="font-family: system-ui, sans-serif; padding: 40px; color: #4a4d68;">
<p>Taking you to the <a href="../" style="color: #a51c30;">tutoring page</a>…</p>
</body>
</html>
